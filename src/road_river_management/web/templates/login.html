<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | 土木管理</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><h1>土木管理システム</h1><p>職員用ログイン</p>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>ログインID<input type="text" name="login_id" autocomplete="username" maxlength="255" required autofocus></label><label>パスワード<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">ログイン</button></form><p class="subtle">オフライン業務用・許可された職員のみ利用可能</p></main></body></html>
